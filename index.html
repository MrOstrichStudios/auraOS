<!DOCTYPE html>
<html>
<head>
  <script src="./script.js" defer></script>
  <link rel="stylesheet" type="text/css" href="style.css?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body style="font-family: 'Press Start 2P', 'Courier New', monospace; height: 100vh; margin: 0px; overflow: hidden;">

<div class="window checklayer" id="welcome" style="top: calc(50% - 90px); left: calc(50% - 180px);">
  <div class="windowheader" id="welcomeheader">
    <p class="headertext" style="flex:1; text-align:center;">Welcome</p>
    <div class="closebutton" id="welcomeclose">×</div>
  </div>
  <div style="color:white; padding:8px; display:flex; align-items:center; gap:8px;">
    <img src="./assets/image2.png" style="width:48px; height:48px; border-radius:4px; object-fit:cover;">
    <h1 style="margin:0; font-size:11px;">auraOS™</h1>
  </div>
  <p style="color:white; margin:0; padding:4px;">
    is a <i>web-based</i> OS built for <code>aura-farmers</code>!
  </p>
</div>
<div id="desktopApps" style="padding-top:64px; width:fit-content; height:fit-content; display:flex; gap:24px;">
  <div style="text-align:center; cursor:pointer;">
    <img src="./assets/note-icon.svg" id="notesIcon" style="image-rendering:pixelated; width:48px; height:48px; border-radius:4px; border-style:solid; cursor:pointer; filter:grayscale(1);">
    <p class="desktop-label">Notes</p>
  </div>
  <div style="text-align:center; cursor:pointer;">
    <img src="./assets/aura-icon.svg" id="auraIcon" style="image-rendering:pixelated; width:48px; height:48px; border-radius:4px; border-style:solid; cursor:pointer; filter:grayscale(1);">
    <p class="desktop-label">Aura Meter</p>
  </div>
  <div style="text-align:center; cursor:pointer;">
    <img src="./assets/calendar-icon.svg" id="calendarIcon" style="image-rendering:pixelated; width:48px; height:48px; border-radius:4px; border-style:solid; cursor:pointer; filter:grayscale(1);">
    <p class="desktop-label">Calendar</p>
  </div>
  <div style="text-align:center; cursor:pointer;">
    <img src="./assets/files-icon.svg" id="filesIcon" style="image-rendering:pixelated; width:48px; height:48px; border-radius:4px; border-style:solid; cursor:pointer; filter:grayscale(1);">
    <p class="desktop-label">Files</p>
  </div>
  <div style="text-align:center; cursor:pointer;">
    <img src="./assets/terminal-icon.svg" id="terminalIcon" style="image-rendering:pixelated; width:48px; height:48px; border-radius:4px; border-style:solid; cursor:pointer; filter:grayscale(1);">
    <p class="desktop-label">Terminal</p>
  </div>
</div>
<div class="window checklayer" id="terminal" style="top: calc(50% - 260px); left: calc(50% - 325px); display:none; width:650px; height:420px;">
  <div class="windowheader" id="terminalheader">
    <p class="headertext" style="flex:1; text-align:center; color:white;">Terminal</p>
    <div class="closebutton" id="terminalclose">×</div>
  </div>
  <div id="terminalOutput" style="flex:1; overflow-y:auto; padding:8px; white-space:pre-wrap;"></div>
  <div style="display:flex; align-items:center; padding:4px 8px 8px 8px; font-family: 'Press Start 2P', 'Courier New', monospace; font-size:12px; color:#d4d4d4;">
    <span id="terminalPrompt" style="margin-right:4px;">human@auraOS:~$</span>
    <input id="terminalInput" style="flex:1; background:none; border:none; outline:none; padding:2px 0;" autocomplete="off" spellcheck="false">
  </div>
</div>
<div class="window checklayer" id="notes" style="top: calc(50% - 300px); left: calc(50% - 330px); display:none; width:660px; height:600px;">
  <div class="windowheader" id="notesheader">
    <p class="headertext" style="flex:1; text-align:center; color:white;">Notes</p>
    <div class="closebutton" id="notesclose">×</div>
  </div>
  <div class="notes-layout">
    <div class="notes-sidebar">
      <div class="notes-sidebar-top">
        <span>My Notes</span>
        <button id="addNoteBtn" title="Add note">＋</button>
      </div>
      <div id="sidebarList"></div>
    </div>
    <div id="notesContent" class="notes-content"></div>
  </div>
</div>

<div class="window checklayer" id="aura" style="top: calc(50% - 220px); left: calc(50% - 180px); display:none; width:360px;">
  <div class="windowheader" id="auraheader">
    <p class="headertext" style="flex:1; text-align:center; color:white;">Aura Meter</p>
    <div class="closebutton" id="auraclose">×</div>
  </div>
  <div style="padding:16px; display:flex; flex-direction:column; align-items:center; gap:12px; color:white;">
    <div id="auraRing" style="width:160px; height:160px; border-radius:4px; background:conic-gradient(#c9c9c9 0%, #838383 0%, rgba(255,255,255,0.1) 0%); display:flex; align-items:center; justify-content:center; transition: background 0.5s ease;">
      <div style="width:120px; height:120px; border-radius:4px; background:rgba(0,0,0,0.6); display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <span id="auraScore" style="font-size:24px; font-weight:bold;">0</span>
        <span style="font-size:9px; opacity:0.7;">aura pts</span>
      </div>
    </div>
    <div id="auraRank" style="font-size:9px; font-weight:bold; color:#d4d4d4;">NO AURA</div>
    <div style="display:flex; gap:8px;">
      <button id="auraPlus" style="padding:8px 20px; border-radius:4px; border:none; background:#d4d4d4; color:#1a1a1a; font-weight:bold; cursor:pointer; font-size:11px;">+ Aura</button>
      <button id="auraMinus" style="padding:8px 20px; border-radius:4px; border:none; background:rgba(255,255,255,0.15); color:#fff; font-weight:bold; cursor:pointer; font-size:11px;">- Aura</button>
      <button id="auraReset" style="padding:8px 20px; border-radius:4px; border:none; background:rgba(255,255,255,0.15); color:#fff; cursor:pointer; font-size:11px;">Reset</button>
    </div>
  </div>
</div>
<div class="window checklayer" id="calendar" style="top: calc(50% - 240px); left: calc(50% - 240px); display:none; width:360px;">
  <div class="windowheader" id="calendarheader">
    <p class="headertext" style="flex:1; text-align:center; color:white;">Calendar</p>
    <div class="closebutton" id="calendarclose">×</div>
  </div>
  <div style="padding:12px; color:white;">
    <div id="calHeader" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <button id="calPrev" style="background:rgba(255,255,255,0.15); border:none; color:#fff; border-radius:0px; cursor:pointer; padding:4px 12px; font-size:11px;">◀</button>
      <span id="calMonthYear" style="font-weight:bold; font-size:9px;"></span>
      <button id="calNext" style="background:rgba(255,255,255,0.15); border:none; color:#fff; border-radius:0px; cursor:pointer; padding:4px 12px; font-size:11px;">▶</button>
    </div>
    <div id="calDow" style="display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:9px; opacity:0.7; margin-bottom:4px;"></div>
    <div id="calGrid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:11px;"></div>
  </div>
</div>

<div class="window checklayer" id="files" style="top: calc(50% - 230px); left: calc(50% - 320px); display:none; width:640px; height:380px;">
  <div class="windowheader" id="filesheader">
    <p class="headertext" style="flex:1; text-align:center; color:white;">Files</p>
    <div class="closebutton" id="filesclose">×</div>
  </div>
  <div style="display:flex; flex:1; min-height:0;">
    <div id="fileList" style="width:170px; backdrop-filter:blur(6px); background-color:rgba(255,255,255,0.1); padding:8px; overflow-y:auto;">
    </div>
    <div id="fileContent" style="flex:1; margin:6px; border-radius:0px; padding:16px; border-style:groove; backdrop-filter:blur(12px); background-color:rgba(255,255,255,0.05); overflow:auto; color:white; font-size:12px; line-height:1.8; white-space:pre-wrap;">
    </div>
  </div>
</div>

<div id="auraVideoOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; align-items:center; justify-content:center; z-index:9999;">
  <video id="auraVideo" src="./assets/aura.mp4" style="width:100vw; height:100vh; object-fit:cover;" autoplay muted playsinline></video>
  <button id="auraVideoClose" style="position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.4); color:#fff; border-radius:4px; padding:8px 16px; cursor:pointer; font-size:10px; z-index:10000;">✕ Close</button>
</div>

<div id="taskbar" style="position:absolute; bottom:0; left:0; right:0; height:56px; display:flex; align-items:center; gap:8px; padding:0 12px; backdrop-filter:blur(10px); background-color:rgba(0,0,0,0.6); color:#fff; z-index:500; box-sizing:border-box; border-top:1px solid rgba(255,255,255,0.15);">
  <p style="margin:0; font-weight:700; background-color:rgba(256,256,256,0.125); padding:4px 12px; border-radius:4px; font-size:9px;">
    auraOS™
  </p>
  <p style="margin:0; background-color:rgba(256,256,256,0.25); padding:4px 12px; border-radius:4px; font-size:9px;">
    <b>Always looksmaxing</b>
  </p>
  <div style="flex:1;"></div>
  <button class="taskbar-btn" id="taskbarNotes">Notes</button>
  <button class="taskbar-btn" id="taskbarAura">Aura Meter</button>
  <button class="taskbar-btn" id="taskbarCalendar">Calendar</button>
  <button class="taskbar-btn" id="taskbarFiles">Files</button>
  <button class="taskbar-btn" id="taskbarTerminal">Terminal</button>
  <div style="flex:1;"></div>
  <p id="taskbarTime" style="margin:0; background-color:rgba(256,256,256,0.25); padding:4px 12px; border-radius:4px; font-size:9px; text-align:right; line-height:1.3;"></p>
  <button class="taskbar-btn" id="taskbarRestart" style="background-color:rgba(200,50,50,0.4);">Restart</button>
</div>
</body>
</html>
